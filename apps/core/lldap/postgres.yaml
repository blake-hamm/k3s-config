apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: postgres-lldap
  annotations:
    argocd.argoproj.io/sync-wave: "100"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  teamId: "acid"
  volume:
    size: 1Gi
  numberOfInstances: 1
  users:
    # role for application foo
    lldap:
      - superuser
  #databases: name->owner
  databases:
    lldap: lldap
  postgresql:
    version: "15"
