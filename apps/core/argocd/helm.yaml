apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-200"
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 7.1.0
    helm:
      valuesObject:
        global:
          logging:
            level: debug
        redis-ha:
          enabled: true
        controller:
          replicas: 2
        server:
          replicas: 2
        applicationSet:
          replicas: 2
        repoServer:
          replicas: 2
        configs:
          params:
            server.insecure: true
          cm:
            oidc.config: |
              name: Authelia
              issuer: https://auth.bhamm-lab.com
              clientID: argocd
              clientSecret: $argocd-external:oidc_client_secret
              cliClientID: 'argocd-cli'
              redirectURI: https://argocd.bhamm-lab.com/auth/callback
              requestedScopes:
                - 'openid'
                - 'profile'
                - 'email'
                - 'groups'
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated:
      prune: true
      selfHeal: true
