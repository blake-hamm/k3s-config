apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "200"
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.9.5
    helm:
      valuesObject:
        pod:
          extraVolumeMounts:
            - mountPath: '/app/external-secrets'
              name: 'external-secrets'
              readOnly: true
          extraVolumes:
            - name: 'external-secrets'
              projected:
                sources:
                  - secret:
                      name: authelia-external
                      items:
                        - key: lldap_password
                          path: lldap_password
                        - key: storage_encryption_key
                          path: storage_encryption_key
                        - key: vault_client_secret
                          path: vault_client_secret
                        - key: jwks_key
                          path: jwks_key
                  - secret:
                      name: authelia.postgres-authelia.credentials.postgresql.acid.zalan.do
                      items:
                        - key: password
                          path: postgres_password
          env:
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
              value: /app/external-secrets/postgres_password
            - name: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE
              value: /app/external-secrets/lldap_password
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /app/external-secrets/storage_encryption_key
        # secret:
        #   oidcPrivateKey:
        #     filename: /app/external-secrets/jwks_key
        configMap:
          log:
            level: 'debug'
          disabled: false
          telemetry:
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
                labels:
                  release: monitor
          default_2fa_method: totp
          theme: 'dark'
          password_reset:
            disable: true
          authentication_backend:
            ldap:
              enabled: true
              implementation: 'custom'
              address: 'ldap://lldap:3890'
              base_dn: 'DC=bhamm-lab,DC=com'
              additional_users_dn: ou=people
              users_filter: "(&({username_attribute}={input})(objectClass=person))"
              additional_groups_dn: ou=groups
              groups_filter: "(member={dn})"
              attributes:
                display_name: displayName
                username: uid
                group_name: cn
                mail: mail
              user: 'uid=authelia,ou=people,DC=bhamm-lab,DC=com'
              password:
                disabled: true
          storage:
            encryption_key:
              disabled: true
            postgres:
              enabled: true
              deploy: false
              address: 'tcp://postgres-authelia:5432'
              timeout: '5 seconds'
              database: 'authelia'
              schema: 'public'
              username: 'authelia'
              password:
                disabled: true
              tls:
                skip_verify: true
          notifier:
            filesystem:
              enabled: true
          access_control:
            default_policy: deny
            rules:
              - domain:
                  - nginx.bhamm-lab.com
                  - traefik.bhamm-lab.com
                policy: two_factor
              - domain: '*.bhamm-lab.com'
                policy: one_factor
          session:
            cookies:
              - subdomain: 'auth'
                domain: 'bhamm-lab.com'
            redis:
              enabled: true
              deploy: true
              host: 'authelia-redis-master'
          identity_providers:
            oidc:
              enabled: true
              jwks:
                - key: >-
                    {{ printf "{{ secret "/app/external-secrets/jwks_key" | mindent 10 "|" | msquote }}" }}
              authorization_policies:
                policy_name:
                  default_policy: 'two_factor'
                  rules:
                    - policy: 'deny'
                      subject: 'group:services'
                      # clients:
                      #   - client_id: 'vault'
                      #     client_name: 'HashiCorp Vault'
                      #     client_secret: '{{ secret "/app/external-secrets/vault_client_secret" | mindent 10 "|" | msquote }}'
                      #     public: false
                      #     authorization_policy: 'two_factor'
                      #     redirect_uris:
                      #       - 'https://vault.bhamm-lab.com/oidc/callback'
                      #       - 'https://vault.bhamm-lab.com/ui/vault/auth/oidc/oidc/callback'
                      #     scopes:
                      #       - 'openid'
                      #       - 'profile'
                      #       - 'groups'
                      #       - 'email'
                      #     userinfo_signed_response_alg: 'none'
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated:
      prune: true
      selfHeal: true
