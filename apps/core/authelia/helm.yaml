apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "200"
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.9.5
    helm:
      valuesObject:
        configMap:
          disabled: false
          telemetry:
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
                labels:
                  release: monitor
          theme: 'dark'
          authentication_backend:
            ldap:
              enabled: true
              implementation: 'lldap'
              address: 'ldap://lldap'
              base_dn: 'DC=bhamm-lab,DC=com'
              additional_users_dn: 'OU=Users'
              additional_groups_dn: 'OU=Groups'
              user: 'CN=bhamm,DC=bhamm-lab,DC=com'
          storage:
            postgres:
              enabled: true
              deploy: false
              address: 'tcp://postgres-authelia:5432'
              timeout: '5 seconds'
              database: 'authelia'
              schema: 'public'
              username: 'authelia'
              password:
                disabled: true
        secret:
          storage:
            key: postgres.postgres-authelia.credentials.postgresql.acid.zalan.do
            value: password
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated:
      prune: true
      selfHeal: true
