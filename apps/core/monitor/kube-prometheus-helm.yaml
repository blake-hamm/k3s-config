apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitor
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-150"
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 61.2.0
    helm:
      valuesObject:
        prometheusOperator:
          jobs:
            annotations:
              argocd.argoproj.io/hook: Sync
          admissionWebhooks:
            annotations:
              argocd.argoproj.io/hook: Sync
            mutatingWebhookConfiguration:
              annotations:
                argocd.argoproj.io/hook: Sync
            validatingWebhookConfiguration:
              annotations:
                argocd.argoproj.io/hook: Sync
        prometheus:
          prometheusSpec:
            serviceMonitorSelector:
              matchLabels:
                release: monitor
        grafana:
          admin:
            existingSecret: monitoring-login
            userKey: admin-user
            passwordKey: admin-password
            sidecar:
              dashboards:
                enabled: true
                defaultFolderName: "General"
                label: grafana_dashboard
                labelValue: "1"
                folderAnnotation: grafana_folder
                searchNamespace: ALL
                provider:
                  foldersFromFilesStructure: true
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: 'extra-dashboards'
                  orgId: 1
                  folder: 'Extras'
                  type: file
                  disableDeletion: true
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/extra-dashboards
          dashboards:
            extra-dashboards:
              k8s-system-api-server:
                url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
                token: ''
              k8s-system-coredns:
                url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
                token: ''
              k8s-views-global:
                url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
                token: ''
              k8s-views-namespaces:
                url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
                token: ''
              k8s-views-nodes:
                url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
                token: ''
              k8s-views-pods:
                url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
                token: ''
              ceph-cluster:
                gnetId: 2842
                revision: 17
              traefik:
                gnetId: 17347
                revision: 9
              metallb:
                gnetId: 20162
                revision: 5
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - Replace=true # https://github.com/argoproj/argo-cd/issues/8128
    automated:
      prune: true
      selfHeal: true
